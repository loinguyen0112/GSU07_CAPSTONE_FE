# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: ziam.dashboard
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://s40.gb.ucc.cit.tum.de:443
          client: '324'
        app:
          name: ZIAM_DASHBOARD
          description: IAM Operations Dashboard
          package: $ZIAM
          transport: S40K919595
        exclude:
          - /test/
  resources:
    excludes:
      - /test/**
      - /localService/**
